<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>اختبار الأنسجة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#0d0f14;color:#e8e4d8;font-family:'Tajawal',sans-serif}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.screen.active{display:flex}
#home{gap:40px}
.logo-icon{font-size:52px;text-align:center;display:block}
.logo-title{font-size:clamp(28px,6vw,48px);font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,#c9a84c 0%,#f0d080 50%,#c9a84c 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center}
.logo-sub{color:#7a7d8a;font-size:15px;margin-top:6px;font-weight:300;letter-spacing:2px;text-align:center}
.divider{width:60px;height:1px;background:#8a6f2e;opacity:.5;margin:0 auto}
.mode-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;width:100%;max-width:680px}
.mode-card{flex:1 1 280px;background:#1c2030;border:1px solid #2a2f42;border-radius:14px;padding:32px 28px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;text-align:center}
.mode-card:hover{transform:translateY(-4px);border-color:#8a6f2e;box-shadow:0 16px 48px rgba(0,0,0,.4)}
.mode-icon{font-size:38px;margin-bottom:14px}
.mode-title{font-size:20px;font-weight:700;color:#e8e4d8;margin-bottom:8px}
.mode-desc{font-size:13px;color:#7a7d8a;line-height:1.7}
.mode-badge{display:inline-block;margin-top:16px;background:#8a6f2e;color:#0d0f14;font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 12px;border-radius:20px}
#quiz{padding:20px;gap:0;justify-content:flex-start}
.quiz-header{width:100%;max-width:800px;display:flex;align-items:center;justify-content:space-between;padding:14px 0 20px}
.back-btn{background:none;border:1px solid #2a2f42;color:#7a7d8a;cursor:pointer;border-radius:8px;padding:8px 14px;font-size:13px;font-family:'Tajawal',sans-serif;transition:border-color .2s,color .2s}
.back-btn:hover{border-color:#8a6f2e;color:#c9a84c}
.quiz-progress-text{font-size:14px;color:#7a7d8a}
.quiz-progress-text span{color:#c9a84c;font-weight:700}
.timer-display{font-size:15px;font-weight:700;color:#c9a84c;background:rgba(201,168,76,.1);border:1px solid #8a6f2e;padding:6px 14px;border-radius:8px;min-width:70px;text-align:center}
.timer-display.hidden{visibility:hidden}
.timer-display.urgent{color:#e05c5c;background:rgba(224,92,92,.1);border-color:rgba(224,92,92,.4)}
.progress-bar-wrap{width:100%;max-width:800px;height:3px;background:#2a2f42;border-radius:3px;margin-bottom:24px}
.progress-bar-fill{height:100%;background:#c9a84c;border-radius:3px;transition:width .4s}
.quiz-card{width:100%;max-width:800px;background:#1c2030;border:1px solid #2a2f42;border-radius:14px;overflow:hidden}
.slide-image-wrap{width:100%;aspect-ratio:4/3;background:#0a0b10;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.slide-image-wrap img{width:100%;height:100%;object-fit:contain;display:block}
.img-placeholder{color:#7a7d8a;font-size:14px;text-align:center;padding:20px}
.quiz-input-area{padding:24px}
.input-label{font-size:13px;color:#7a7d8a;margin-bottom:10px;letter-spacing:.5px}
.input-row{display:flex;gap:10px}
.answer-input{flex:1;background:#151820;border:1px solid #2a2f42;border-radius:10px;padding:14px 18px;font-size:17px;font-family:'Tajawal',sans-serif;color:#e8e4d8;outline:none;transition:border-color .2s;text-align:right}
.answer-input:focus{border-color:#8a6f2e}
.answer-input.correct{border-color:#4caf7d;background:rgba(76,175,125,.06)}
.answer-input.wrong{border-color:#e05c5c;background:rgba(224,92,92,.06)}
.submit-btn{background:#c9a84c;color:#0d0f14;border:none;border-radius:10px;padding:14px 24px;font-size:16px;font-weight:700;font-family:'Tajawal',sans-serif;cursor:pointer;transition:opacity .2s,transform .15s;white-space:nowrap}
.submit-btn:hover{opacity:.88;transform:scale(1.03)}
.submit-btn:disabled{opacity:.4;cursor:default;transform:none}
.feedback-box{margin-top:16px;padding:14px 18px;border-radius:10px;font-size:15px;display:none;animation:fadeSlide .25s ease}
.feedback-box.correct{background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.27);color:#4caf7d}
.feedback-box.wrong{background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.27);color:#f08080}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.next-btn{margin-top:14px;width:100%;background:#151820;border:1px solid #2a2f42;color:#e8e4d8;border-radius:10px;padding:13px;font-size:15px;font-weight:500;font-family:'Tajawal',sans-serif;cursor:pointer;display:none;transition:border-color .2s,color .2s}
.next-btn:hover{border-color:#8a6f2e;color:#c9a84c}
#results{gap:32px}
.results-card{background:#1c2030;border:1px solid #2a2f42;border-radius:14px;padding:40px 36px;text-align:center;max-width:500px;width:100%}
.results-emoji{font-size:56px;margin-bottom:16px}
.results-title{font-size:26px;font-weight:900;color:#c9a84c;margin-bottom:8px}
.results-mode{font-size:13px;color:#7a7d8a;margin-bottom:28px;letter-spacing:1px}
.stats-row{display:flex;gap:16px;margin-bottom:28px}
.stat-box{flex:1;background:#151820;border:1px solid #2a2f42;border-radius:10px;padding:18px 12px;text-align:center}
.stat-val{font-size:28px;font-weight:900;color:#c9a84c}
.stat-val.green{color:#4caf7d}
.stat-val.red{color:#e05c5c}
.stat-lbl{font-size:12px;color:#7a7d8a;margin-top:4px;letter-spacing:.5px}
.score-bar-wrap{width:100%;height:8px;background:#2a2f42;border-radius:8px;margin-bottom:28px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:8px;transition:width 1s ease;background:#c9a84c}
.btn-group{display:flex;flex-direction:column;gap:10px}
.btn-primary{background:#c9a84c;color:#0d0f14;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:700;font-family:'Tajawal',sans-serif;cursor:pointer;transition:opacity .2s}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:none;border:1px solid #2a2f42;color:#7a7d8a;border-radius:10px;padding:13px;font-size:14px;font-family:'Tajawal',sans-serif;cursor:pointer;transition:border-color .2s,color .2s}
.btn-secondary:hover{border-color:#8a6f2e;color:#c9a84c}
.review-list{width:100%;max-width:600px;display:flex;flex-direction:column;gap:10px}
.review-item{background:#1c2030;border:1px solid #2a2f42;border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:14px;text-align:right}
.review-thumb{width:60px;height:44px;border-radius:6px;object-fit:cover;background:#0a0b10;flex-shrink:0}
.review-info{flex:1}
.review-name{font-size:14px;font-weight:700;color:#e8e4d8}
.review-your{font-size:12px;color:#7a7d8a;margin-top:2px}
.review-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;flex-shrink:0}
.review-badge.no{background:rgba(224,92,92,.13);color:#e05c5c;border:1px solid rgba(224,92,92,.27)}
.review-section-title{font-size:13px;color:#7a7d8a;letter-spacing:1px;text-align:center}
@media(max-width:500px){.mode-cards{flex-direction:column}.stats-row{flex-direction:column}}
</style>
</head>
<body>

<section id="home" class="screen active">
  <div>
    <span class="logo-icon">🔬</span>
    <div class="logo-title">اختبار الأنسجة</div>
    <div class="logo-sub">HISTOLOGY QUIZ</div>
  </div>
  <div class="divider"></div>
  <div class="mode-cards">
    <div class="mode-card" onclick="startMode('practice')">
      <div class="mode-icon">📚</div>
      <div class="mode-title">التدريب الكامل</div>
      <div class="mode-desc">جميع الشرائح بترتيب عشوائي<br/>اكتب اسم كل شريحة وراجع ما أخطأت فيه</div>
      <div class="mode-badge" id="practice-badge">80 شريحة</div>
    </div>
    <div class="mode-card" onclick="startMode('timed')">
      <div class="mode-icon">⏱️</div>
      <div class="mode-title">الاختبار السريع</div>
      <div class="mode-desc">10 شرائح عشوائية<br/>لديك 5 دقائق فقط لتسميتها جميعاً</div>
      <div class="mode-badge">5 دقائق · 10 شرائح</div>
    </div>
  </div>
</section>

<section id="quiz" class="screen">
  <div class="quiz-header">
    <button class="back-btn" onclick="goHome()">← رجوع</button>
    <div class="quiz-progress-text">شريحة <span id="q-current">1</span> من <span id="q-total">10</span></div>
    <div class="timer-display hidden" id="timer-display">5:00</div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>
  <div class="quiz-card">
    <div class="slide-image-wrap">
      <img id="slide-img" src="" alt="" onerror="this.style.display='none';document.getElementById('img-err').style.display='flex'"/>
      <div class="img-placeholder" id="img-err" style="display:none">📁 الصورة غير موجودة<br/><small id="img-err-name" style="color:#555;margin-top:6px;display:block"></small></div>
    </div>
    <div class="quiz-input-area">
      <div class="input-label">اكتب اسم الشريحة:</div>
      <div class="input-row">
        <input id="answer-input" class="answer-input" type="text" placeholder="الاسم..." autocomplete="off"/>
        <button class="submit-btn" id="submit-btn" onclick="checkAnswer()">تأكيد</button>
      </div>
      <div class="feedback-box" id="feedback-box"></div>
      <button class="next-btn" id="next-btn" onclick="nextSlide()">التالي ←</button>
    </div>
  </div>
</section>

<section id="results" class="screen">
  <div class="results-card">
    <div class="results-emoji" id="results-emoji">🎉</div>
    <div class="results-title" id="results-title">نتيجتك</div>
    <div class="results-mode" id="results-mode"></div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-val green" id="stat-correct">0</div><div class="stat-lbl">صح</div></div>
      <div class="stat-box"><div class="stat-val red" id="stat-wrong">0</div><div class="stat-lbl">غلط</div></div>
      <div class="stat-box"><div class="stat-val" id="stat-pct">0%</div><div class="stat-lbl">النسبة</div></div>
    </div>
    <div class="score-bar-wrap"><div class="score-bar-fill" id="score-bar" style="width:0%"></div></div>
    <div class="btn-group">
      <button class="btn-primary" onclick="retryMode()">إعادة المحاولة</button>
      <button class="btn-secondary" onclick="goHome()">الصفحة الرئيسية</button>
    </div>
  </div>
  <div class="review-section-title" id="review-title"></div>
  <div class="review-list" id="review-list"></div>
</section>

<script>
// ══════════════════════════════════════════
//  قائمة الشرائح الـ 80
// ══════════════════════════════════════════
const QUESTIONS = [
  { image:"01.jpg", answer:["Parts of a Microscope","Microscope"] },
  { image:"02.jpg", answer:["Nucleus"] },
  { image:"03.jpg", answer:["Golgi Complex","Golgi Apparatus"] },

  { image:"21.jpg", answer:["Reticular Connective Tissue","Reticular CT"] },
  { image:"22.jpg", answer:["Elastic Connective Tissue","Elastic CT"] },

  { image:"24.jpg", answer:["Loose Connective Tissue","Areolar Connective Tissue","Loose Areolar CT"] },
  { image:"25.jpg", answer:["Dense Irregular Connective Tissue","Dense Irregular CT"] },
  { image:"26.jpg", answer:["Dense Regular Connective Tissue","Dense Regular CT","Tendon"] },
  { image:"27.jpg", answer:["Compact Bone","Bone tissue"] },

  { image:"33.jpg", answer:["Hyaline Cartilage"] },
  { image:"34.jpg", answer:["Hyaline Cartilage","Elastic Fibrocartilage","White Fibrocartilage"] },
  { image:"35.jpg", answer:["Hyaline Cartilage"] },
  { image:"36.jpg", answer:["White Fibrocartilage","Fibrocartilage"] },
  { image:"37.jpg", answer:["Hyaline Cartilage"] },

  { image:"42.jpg", answer:["Monocytes","Monocyte"] },

  { image:"45.jpg", answer:["Cardiac Muscle"] },

  { image:"47.jpg", answer:["Types of Muscle","Muscle types","Cardiac Muscle","Skeletal Muscle","Smooth Muscle"] },
  { image:"48.jpg", answer:["Skeletal Muscle"] },

  { image:"50.jpg", answer:["Nerve Cell","Nervous Tissue"] },
  { image:"51.jpg", answer:["Nerve Cell","Peripheral Myelinated Axon"] },
  { image:"52.jpg", answer:["Kidney","Nephron","Kidney unit structure"] },
  { image:"53.jpg", answer:["Artery","Vein","Artery and Vein"] },
  { image:"54.jpg", answer:["Artery"] },
  { image:"55.jpg", answer:["Artery"] },
  { image:"56.jpg", answer:["Ciliated Pseudostratified Columnar Epithelium","Pseudostratified Columnar Epithelium"] },
  { image:"57.jpg", answer:["Simple Cuboidal Epithelium","Simple Cuboid Epithelium"] },
  { image:"58.jpg", answer:["Simple Cuboidal Epithelium","Simple Cuboid Epithelium"] },
  { image:"59.jpg", answer:["Transitional Epithelium"] },
  { image:"60.jpg", answer:["Stratified Squamous Non-Keratinized Epithelium","Non-Keratinized Epithelium"] },
  { image:"61.jpg", answer:["Stratified Squamous Keratinized Epithelium","Keratinized Epithelium"] },
  { image:"62.jpg", answer:["Compact Bone","Bone tissue"] },
  { image:"63.jpg", answer:["Spongy Bone","Cancellous Bone"] },
  { image:"64.jpg", answer:["Compact Bone"] },
  { image:"65.jpg", answer:["Hyaline Cartilage"] },
  { image:"66.jpg", answer:["Hyaline Cartilage"] },
  { image:"67.jpg", answer:["Hyaline Cartilage"] },
  { image:"68.jpg", answer:["Neutrophils","Neutrophil"] },
  { image:"69.jpg", answer:["Blood Smear","Blood"] },
  { image:"70.jpg", answer:["Eosinophil","Eosinophils"] },
  { image:"71.jpg", answer:["Platelet","Platelets"] },
  { image:"72.jpg", answer:["Monocytes","Monocyte"] },
  { image:"73.jpg", answer:["Skeletal Muscle"] },
  { image:"74.jpg", answer:["Skeletal Muscle"] },
  { image:"75.jpg", answer:["Reticular Connective Tissue","Reticular CT","Glandular Tissue"] },
  { image:"76.jpg", answer:["Nerve Cell","Peripheral Myelinated Axon","Nervous Tissue"] },
  { image:"77.jpg", answer:["Nerve Cell","Nervous Tissue"] },
  { image:"78.jpg", answer:["Kidney","Nephron","Kidney unit structure"] },
  { image:"79.jpg", answer:["Kidney","Kidney tissue"] },
  { image:"80.jpg", answer:["Artery"] },
];

// ══════════════════════════════════════════
let currentMode='practice',questions=[],currentIndex=0,correctCount=0,wrongCount=0,answered=false,timerInterval=null,timeLeft=300,reviewLog=[];

window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('practice-badge').textContent=QUESTIONS.length+' شريحة';
  document.getElementById('answer-input').addEventListener('keydown',e=>{
    if(e.key==='Enter'){if(!answered)checkAnswer();else if(document.getElementById('next-btn').style.display!=='none')nextSlide();}
  });
});

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goHome(){stopTimer();showScreen('home');}

function startMode(mode){
  currentMode=mode;currentIndex=0;correctCount=0;wrongCount=0;reviewLog=[];answered=false;
  const pool=[...QUESTIONS];shuffle(pool);
  if(mode==='timed'){questions=pool.slice(0,Math.min(10,pool.length));timeLeft=300;startTimer();document.getElementById('timer-display').classList.remove('hidden','urgent');}
  else{questions=pool;stopTimer();document.getElementById('timer-display').classList.add('hidden');}
  document.getElementById('q-total').textContent=questions.length;
  showScreen('quiz');loadQuestion();
}

function loadQuestion(){
  answered=false;
  const q=questions[currentIndex];
  const img=document.getElementById('slide-img'),err=document.getElementById('img-err');
  img.style.display='block';err.style.display='none';
  img.src='images/'+q.image;
  document.getElementById('img-err-name').textContent=q.image;
  document.getElementById('q-current').textContent=currentIndex+1;
  document.getElementById('progress-bar').style.width=(currentIndex/questions.length*100)+'%';
  const input=document.getElementById('answer-input');
  input.value='';input.className='answer-input';input.disabled=false;input.focus();
  const fb=document.getElementById('feedback-box');fb.className='feedback-box';fb.style.display='none';fb.textContent='';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('submit-btn').disabled=false;
}

function checkAnswer(){
  if(answered)return;
  const input=document.getElementById('answer-input'),userAns=normalize(input.value),q=questions[currentIndex];
  const answers=Array.isArray(q.answer)?q.answer:[q.answer];
  const correct=answers.some(a=>normalize(a)===userAns);
  answered=true;document.getElementById('submit-btn').disabled=true;input.disabled=true;
  const fb=document.getElementById('feedback-box');fb.style.display='block';
  if(correct){correctCount++;input.classList.add('correct');fb.className='feedback-box correct';fb.textContent='✅ إجابة صحيحة!';}
  else{wrongCount++;input.classList.add('wrong');fb.className='feedback-box wrong';fb.textContent='❌ الإجابة الصحيحة: '+answers[0];}
  reviewLog.push({q,userAnswer:input.value,correct});
  const nb=document.getElementById('next-btn');nb.style.display='block';nb.textContent=currentIndex+1<questions.length?'التالي ←':'عرض النتيجة ←';
}

function nextSlide(){currentIndex++;if(currentIndex>=questions.length)showResults();else loadQuestion();}

function startTimer(){stopTimer();updateTimerDisplay();timerInterval=setInterval(()=>{timeLeft--;updateTimerDisplay();if(timeLeft<=0){stopTimer();showResults(true);}},1000);}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}
function updateTimerDisplay(){const el=document.getElementById('timer-display'),m=Math.floor(timeLeft/60),s=timeLeft%60;el.textContent=m+':'+String(s).padStart(2,'0');el.classList.toggle('urgent',timeLeft<=60);}

function showResults(timeout=false){
  stopTimer();showScreen('results');
  const total=reviewLog.length,pct=total>0?Math.round(correctCount/total*100):0;
  document.getElementById('stat-correct').textContent=correctCount;
  document.getElementById('stat-wrong').textContent=wrongCount;
  document.getElementById('stat-pct').textContent=pct+'%';
  const emoji=timeout?'⏰':pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📖';
  document.getElementById('results-emoji').textContent=emoji;
  document.getElementById('results-title').textContent=pct>=90?'ممتاز!':pct>=70?'أحسنت!':pct>=50?'جيد، واصل التدريب':'راجع الشرائح مرة أخرى';
  document.getElementById('results-mode').textContent=(currentMode==='timed'?'الاختبار السريع':'التدريب الكامل')+(timeout?' · انتهى الوقت':'');
  setTimeout(()=>{const b=document.getElementById('score-bar');b.style.width=pct+'%';b.style.background=pct>=70?'#4caf7d':pct>=40?'#c9a84c':'#e05c5c';},100);
  const list=document.getElementById('review-list'),title=document.getElementById('review-title');list.innerHTML='';
  const wrongs=reviewLog.filter(r=>!r.correct);
  if(wrongs.length>0){title.textContent='الشرائح التي تحتاج مراجعة — '+wrongs.length;wrongs.forEach(r=>{const cn=Array.isArray(r.q.answer)?r.q.answer[0]:r.q.answer;const div=document.createElement('div');div.className='review-item';div.innerHTML=`<img class="review-thumb" src="images/${r.q.image}" alt=""/><div class="review-info"><div class="review-name">${cn}</div><div class="review-your">إجابتك: ${r.userAnswer||'—'}</div></div><div class="review-badge no">غلط</div>`;list.appendChild(div);});}
  else{title.textContent=total>0?'🎯 أجبت على الكل صح!':'';}
}

function retryMode(){startMode(currentMode);}

function normalize(str){return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064B-\u065F]/g,'');}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}}
</script>
